[project]
name = "agent-harness"
version = "0.1.0"
description = "An AI creative strategist harness: top ads -> hooks -> iteration briefs"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.70",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
