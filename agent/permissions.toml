# Which tools the agent may run, and which need a human first.
#
# Precedence: deny > ask > allow. Every matching rule is evaluated and the most
# restrictive wins, so a narrow allow cannot punch a hole in a broad deny.
#
# Patterns are exact names, or a trailing * for a prefix ("mcp__triplewhale__*").

# What happens to a tool no rule mentions. Keep this at "ask" — a tool nobody has
# thought about should stop and check, not run.
default = "ask"

# Read-only. Nothing here can change the account, the files, or the outside world.
allow = [
  "list_memory",
  "read_memory",

  # Atria reads. Everything that only looks: the ad library, the workspace's own ad
  # accounts and their metrics, creative tags, cached transcripts, boards, notes.
  # get_library_ad_transcript is free; transcribe_* is not, which is why they are split.
  "mcp__atria__get_*",
  "mcp__atria__list_*",
  "mcp__atria__search_*",
  "mcp__atria__resolve_*",
  "mcp__atria__read_*",
  "mcp__atria__discover_*",
  "mcp__atria__suggest_*",
  "mcp__atria__ping",
]

# Writes, or anything with a side effect worth a glance before it happens.
# A decision reserved to a person: asked like `ask`, but `--yes` may not answer it, and
# approving once is not approving the next one. A plan is the only thing here — approving
# a plan is the moment a run stops being read-only, so it should never happen because a
# flag was passed to a cron job.
confirm = ["submit_plan"]

ask = [
  "append_run_log",

  # The agent writing into its own control plane. Append-only, one allowlisted file,
  # size-capped, and in git — but it is still the thing it reads next run, so it asks.
  # Move to `allow` if the unattended daily job should be able to learn without a human;
  # with `ask` an unattended run can never record a finding.
  "append_memory",

  # Atria writes. Each of these changes the workspace or spends credits, and the agent's
  # job is to write scripts, not to reorganise the account. follow_advertiser says so
  # itself: "This has real effects, not just a bookmark."
  "mcp__atria__create_*",
  "mcp__atria__transcribe_*",
  "mcp__atria__follow_advertiser",
  "mcp__atria__save_library_ad",
  "mcp__atria__write_note",
  "mcp__atria__add_owned_brand_competitor",
]

# Never, whatever the model argues. Nothing yet — this fills in as tools arrive that
# should exist for reading but never for acting.
deny = [
  # Destructive. Nothing about reading hooks and writing scripts requires undoing
  # workspace state, so these are refused outright rather than left to a tired yes.
  "mcp__atria__unfollow_advertiser",
  "mcp__atria__unsave_library_ad",
  "mcp__atria__remove_*",
]

# ---------------------------------------------------------------------------
# MCP tools (Atria)
#
# Bridged tools are named mcp__<server>__<tool>, and patterns take a trailing *.
# They are deliberately NOT listed yet: run `harness mcp` to sign in and print the
# real tool names, then add rules here. Until you do they fall to default = "ask",
# which prompts in a terminal and denies in an unattended run. That is the intended
# failure mode — a tool nobody has reviewed should not reach a live ad account.
#
# Once you know the names, the shape is roughly:
#
#   allow = [..., "mcp__triplewhale__get_*", "mcp__atria__search_*"]
#   ask   = [..., "mcp__atria__generate_*"]
#   deny  = ["mcp__*__delete_*"]
#
# Remember precedence: deny beats ask beats allow, so a broad deny on writes stays
# safe even if a later allow pattern is too generous.
