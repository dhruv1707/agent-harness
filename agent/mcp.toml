# MCP servers the agent connects to.
#
# The harness is the MCP client, deliberately. Gemini can declare an MCP server natively
# and call it server-side, but those calls execute at Google and reach us only after the
# fact — the permission gate never gets a vote. Bridged here, every remote tool is an
# ordinary local tool: same permissions, same concurrency rules, same ledger.
#
# Tools are registered as mcp__<server>__<tool>, which is what the wildcard patterns in
# permissions.toml match against.

[servers.triplewhale]
url = "https://mcp.triplewhale.com/v1/mcp"
# OAuth2 is read-only (moby:read), needs no key, and can be revoked. Triple Whale
# recommends it over the API key wherever the client supports it — we do.
# To use a key instead: auth = "header", header_name = "x-api-key",
# api_key_env = "TRIPLEWHALE_API_KEY"
auth = "oauth"

[servers.atria]
url = "https://api.tryatria.com/mcp"
# Atria's MCP server is OAuth 2.1 only. The X-API-Key on their site is for the REST API.
auth = "oauth"
enabled = true

# Atria exposes 45 tools. Loading all of them costs ~27k prefix tokens on every request
# and gives the model 45 things to choose between; Atria's own `discover_apis` exists
# because clients are expected to load a subset. These are the ones the daily job uses,
# grouped by workflow step. Delete this list to load everything.
tools = [
  # 1. Pull — the account's own ads and how they performed
  "list_ad_accounts",
  "list_ad_account_ads",
  "list_ad_account_metrics",
  "get_ad_account_ad",
  "get_ad_account_summary",

  # 2. Read the hooks — creative tagging and transcripts.
  #    list_ad_account_creative_tags carries what the creative does AND which of it works.
  "list_ad_account_creative_tags",
  "get_ad_account_creative_tags",
  "get_ad_account_video_transcript",
  "transcribe_ad_account_video",

  # 3. Find the pattern — group and rank ads by a creative dimension
  "list_library_taggings",
  "search_library_ads",
  "get_library_ad",
  "get_library_ad_creative_tags",
  "get_library_ad_transcript",

  # 4. Write — brand and product facts.
  #    Note get_owned_brand also carries a voice; memory/brand-voice.md stays the
  #    authority, since it is derived from scripts that actually shipped.
  "list_owned_brands",
  "get_owned_brand",
  "list_owned_brand_products",
]
