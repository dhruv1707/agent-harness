# MCP servers the agent connects to.
#
# The harness is the MCP client, deliberately. Gemini can declare an MCP server natively
# and call it server-side, but those calls execute at Google and reach us only after the
# fact — the permission gate never gets a vote. Bridged here, every remote tool is an
# ordinary local tool: same permissions, same concurrency rules, same ledger.
#
# Tools are registered as mcp__<server>__<tool>, which is what the wildcard patterns in
# permissions.toml match against.
#
# Triple Whale was removed. Its MCP access is gated on a plan entitlement the Plufl store
# does not have (mcpEnabled: false — every data tool returns a plan error), and Atria's
# list_ad_account_ads / list_ad_account_metrics cover the ranking it was wanted for.

[servers.atria]
url = "https://api.tryatria.com/mcp"
# OAuth 2.1 only. The X-API-Key on Atria's site is for their REST API, not MCP.
auth = "oauth"
enabled = true

# Atria exposes 45 tools. Every declaration costs prefix tokens on every request and gives
# the model one more thing to choose between, so this loads only what the daily job needs.
# Atria's own `discover_apis` exists because clients are expected to load a subset.
# Delete this list to load everything.
tools = [
  # --- 1. Rank the account's own ads -------------------------------------------
  # The account id is fixed in CLAUDE.md, so list_ad_accounts is not needed.
  # metrics is a *catalog*, not values: it confirms which metric ids exist before
  # one is passed to sort_by.
  "list_ad_account_metrics",
  "list_ad_account_ads",

  # --- 2. Read the hook --------------------------------------------------------
  # get_ad_account_ad yields creative.videos[].video_id, which the transcript
  # calls need. The GET transcript is free and cache-only; transcribe costs
  # credits and blocks 30-60s, so it is gated behind `ask`.
  "get_ad_account_ad",
  "get_ad_account_video_transcript",
  "transcribe_ad_account_video",

  # --- 3. Find the pattern across winners --------------------------------------
  # list_ad_account_creative_tags groups the window's spend and performance across
  # ten dimensions including visual hook. get_ad_account_creative_tags drills into
  # specific assets, up to 20 ids per call.
  "list_ad_account_creative_tags",
  "get_ad_account_creative_tags",

  # --- 4. Competitor library ---------------------------------------------------
  # get_library_ad returns media files, not what is said in them; for video ads the
  # hook lives in the transcript, which is free and safe across a whole page.
  "search_library_ads",
  "get_library_ad",
  "get_library_ad_transcript",

  # --- 5. Brand and product facts ----------------------------------------------
  # The brand id is fixed in CLAUDE.md, so list_owned_brands is not needed.
  # get_owned_brand carries avoid_words, which is a compliance boundary.
  # list_owned_brand_products carries customer_awareness_levels and
  # market_sophistication_levels — what decides whether a straight claim still lands.
  "get_owned_brand",
  "list_owned_brand_products",
]
